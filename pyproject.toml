[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "211-ai"
version = "0.1.0"
description = "Monorepo packaging for the 211-AI scraper and wallet application surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pdfplumber>=0.11.0",
  "python-pptx>=1.0.2,<2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "playwright>=1.42.0",
  "aiohttp>=3.9.0",
  "aiofiles>=23.2.1",
  "tqdm>=4.66.0",
  "tenacity>=8.2.3",
  "pandas>=2.2.0",
  "duckdb>=1.4.0",
  "pyarrow>=16.0.0",
  "networkx>=3.3",
  "sentence-transformers>=3.0.0,<6.0.0",
  "datasets>=2.20.0",
  "huggingface-hub>=0.34.0",
  "python-dotenv>=1.0.0",
  "fake-useragent>=1.4.0",
  "warcio>=1.7.4",
]

[project.optional-dependencies]
wallet = [
  "anyio>=4.4,<5.0",
  "cachetools>=5.3,<7.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.30,<1.0",
]
test = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0",
]
lint = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",   # line too long — handled by formatter separately
  "F401",   # unused imports — many are re-exports
  "F403",   # star imports — used in routes re-exports during transition
]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap sys.path then import monorepo packages; isort/E402 fight those blocks.
"tests/e2e/**/*.py" = ["E402", "I001"]
"tests/voice/**/*.py" = ["E402", "I001"]
"wallet_interface/tests/**/*.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = false
no_strict_optional = true

[project.scripts]
ai211-scraper = "scraper.main:main"
ai211-wallet-api = "wallet_interface.cli:main"

[tool.setuptools.packages.find]
include = ["scraper*", "wallet_interface*"]
exclude = ["wallet_interface.ui*", "tests*", "artifacts*", "docs*", "data*", "state*", "tmp_assets*"]

[tool.pytest.ini_options]
testpaths = ["tests", "wallet_interface/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: marks tests as requiring live external services (deselect with '-m \"not integration\"')",
  "experimental: marks tests as speculative, adversarial, or requiring non-deterministic deps (deselect with '-m \"not experimental\"')",
  "world_aid_egress_canary: deliberately attempts a guarded non-local connection and requires the deny/spy to report it",
]
