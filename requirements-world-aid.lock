# This is intentionally not an installable selection. The exact DuckDB
# release, wheel and hash remain human-owned until Gate 0B-selection binds
# them. Human reviewers must replace this proposal with the exact hash-pinned
# lock before signing Gate 0B-selection. G040 consumes that signed digest
