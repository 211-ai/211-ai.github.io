# DuckDB version, CPython interpreter tag, CPython ABI tag, and platform tag.
# HUMAN_SELECTION_REQUIRED: the signed record must bind the same raw wheel
# bytes with sha256:<64 lowercase hex> under its mode-read-only wheelhouse.
# duckdb==<GATE-0B-SELECTION-REQUIRED> \\
#     --hash=sha256:<GATE-0B-SELECTION-REQUIRED>

# The proposal's non-DuckDB runtime closure is likewise human-reviewed and
# must be hash-pinned before installation. No package installation is implied.
